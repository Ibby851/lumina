{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Changed — Lumina</title>
	<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #0f0f13;
			--night: #111827;
			--white: #f8fafc;
			--soft-white: #cbd5e1;
			--muted: #94a3b8;
			--violet: #7c3aed;
			--violet-light: #a78bfa;
			--cyan: #22d3ee;
		}

		body {
			font-family: 'Inter', sans-serif;
			background: linear-gradient(135deg, var(--ink) 0%, var(--night) 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--white);
			margin: 0;
			padding: 24px;
		}

		.success-card {
			width: 100%;
			max-width: 540px;
			padding: 2.75rem 2.5rem;
			text-align: center;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 24px;
			box-shadow: 0 22px 54px rgba(124, 58, 237, 0.22);
			backdrop-filter: blur(12px);
		}

		.brand {
			display: inline-block;
			margin-bottom: 1.5rem;
			font-family: 'Outfit', sans-serif;
			font-size: 2rem;
			font-weight: 700;
			background: linear-gradient(135deg, var(--violet-light), var(--cyan));
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.success-icon {
			width: 90px;
			height: 90px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 1.25rem;
			border-radius: 50%;
			color: #67e8f9;
			font-size: 2.6rem;
			background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(34, 211, 238, 0.18));
			border: 1px solid rgba(168, 85, 247, 0.4);
			box-shadow: 0 10px 30px rgba(34, 211, 238, 0.18);
		}

		h1 {
			margin-bottom: 0.75rem;
			color: var(--white);
			font-family: 'Outfit', sans-serif;
			font-size: clamp(2rem, 4vw, 2.7rem);
			font-weight: 700;
		}

		p {
			margin-bottom: 1.5rem;
			color: var(--soft-white);
			font-size: 1.05rem;
			line-height: 1.75;
		}

		.security-note {
			margin-bottom: 1.75rem;
			padding: 0.85rem 1rem;
			color: var(--muted);
			font-size: 0.9rem;
			line-height: 1.55;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.07);
			border-radius: 12px;
		}

		.btn-primary-custom {
			display: inline-block;
			padding: 12px 28px;
			color: #fff;
			font-weight: 600;
			text-decoration: none;
			background: linear-gradient(135deg, var(--violet), #6d28d9);
			border: none;
			border-radius: 12px;
			box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.btn-primary-custom:hover,
		.btn-primary-custom:focus-visible {
			color: #fff;
			transform: translateY(-1px);
			box-shadow: 0 14px 30px rgba(124, 58, 237, 0.45);
		}

		@media (max-width: 480px) {
			.success-card {
				padding: 2.25rem 1.35rem;
			}
		}
	</style>
</head>
<body>
	<main class="success-card">
		<div class="brand">Lumina</div>
		<div class="success-icon" aria-hidden="true">✓</div>
		<h1>Password changed successfully</h1>
		<p>Your account is secure with your new password. You can now sign in and continue your Lumina journey.</p>
		<div class="security-note">For your security, any previous password reset links are no longer valid.</div>
		<a href="{% url 'accounts:login' %}" class="btn-primary-custom">Continue to login</a>
	</main>
</body>
</html>
