{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified — Lumina</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f13 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }

    .brand {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .success-card {
      width: 100%;
      max-width: 540px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 22px 54px rgba(124, 58, 237, 0.22);
      backdrop-filter: blur(12px);
    }

    .success-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(34,211,238,0.18));
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #67e8f9;
      font-size: 2.5rem;
      box-shadow: 0 10px 30px rgba(34,211,238,0.2);
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.7rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }

    p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.75rem;
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(124,58,237,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary-custom:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(124,58,237,0.45);
      color: #fff;
    }

    .btn-secondary-custom {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      font-weight: 600;
      padding: 11px 22px;
      border-radius: 12px;
    }

    .btn-secondary-custom:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
    }

    .text-muted-soft {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="success-card text-center">
    <div class="brand">Lumina</div>
    <div class="success-icon">✓</div>
    <h1>Email Verification Needed</h1>
    <p>
        Verification mail has been sent to the email used for the account setup
    </p>

    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{% url 'accounts:login' %}" class="btn btn-primary-custom">Go to login</a>
      <a href="{% url 'accounts:register' %}" class="btn btn-secondary-custom">Create another account</a>
    </div>

    <p class="text-muted-soft mt-4 mb-0">Welcome to Lumina — where meaningful connections begin.</p>
  </div>
</body>
</html>
