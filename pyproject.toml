[project]
name = "lumina"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "dj-database-url>=3.1.2",
    "django>=6.1",
    "django-bootstrap5>=26.2",
    "django-q2>=1.11.1",
    "django-widget-tweaks>=1.5.1",
    "pillow>=12.3.0",
    "psycopg>=3.3.6",
    "psycopg2[binary]>=2.9.13",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
lumina = "lumina:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
